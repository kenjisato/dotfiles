# Set a smaller delay
set -s escape-time 1

# Index starts at 1 instead of 0
set -g base-index 1
set -w -g pane-base-index 1

# Shortcuts
bind r \
    source-file ~/.tmux.conf \; \
    display-message "Configuration reloaded"

# Split panes with | and -
bind | split-window -h
bind - split-window -v

# Move between panes with h,j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Claude Code (TUI) compatibility — official recommended settings.
# Without these, inside tmux: Shift+Enter submits instead of inserting a
# newline, and desktop notifications / progress bar never reach the outer
# terminal. https://code.claude.com/docs/en/terminal-config
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Mouse
set -g mouse off

# Appearances
set -g status-style fg=white,bg=default
set -g window-status-style fg=colour246,bg=default
set -g window-status-current-style fg=colour232,bg=colour214,bold
set -w -g pane-border-style fg=colour240,bg=default
set -w -g pane-active-border-style fg=colour214,bold,bg=default

set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-format " #[fg=colour232,bg=colour75,bold] #P #[default] #(tmux-pane-border '#{pane_current_path}')"

# Inactive panes: bg=default → transparent, blends into the iTerm2 background.
# Active pane: opaque bg → solid, stands out (lower apparent transparency).
set -g window-style fg=colour240,bg=default
set -g window-active-style fg=colour252,bg=colour232
set -g message-style fg=white,bg=color242,bold

# Status Line
set -g status-justify left

# Left: session name in a blue pill.
set -g status-left-length 30
set -g status-left "#[fg=colour232,bg=colour75,bold] #S #[default] "

# Window list: index + name. Current window uses the orange of the active
# pane border, so "where am I" reads the same on the bar and the border.
set -g window-status-separator ""
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=colour232,bg=colour214,bold] #I #W #[default]"

# Right: date + time.
set -g status-right-length 40
set -g status-right "#[fg=colour246]%Y-%m-%d #[fg=colour252,bold]%R "

set -w -g monitor-activity on
set -w -g visual-activity on

