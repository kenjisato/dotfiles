# Set a smaller delay
set -s escape-time 1

# Index starts at 1 instead of 0
set -g base-index 1
set -w -g pane-base-index 1

# Shortcuts
bind r \
    source-file ~/.tmux.conf \; \
    display-message "Configuration reloaded"

# Split panes with | and -
bind | split-window -h
bind - split-window -v

# Move between panes with h,j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse
set -g mouse off

# Appearances
set -g status-style fg=white,bg=black
set -g window-status-style fg=cyan,bg=black
set -g window-status-current-style fg=white,bold,bg=red
set -w -g pane-border-style fg=white,bg=color235
set -w -g pane-active-border-style fg=yellow,bg=black

set -g pane-border-status top
set -g pane-border-format "#[fg=black,bg=blue] #P #(tmux-pane-border '#{pane_current_path}')"
set -g pane-border-fg colour023
set -g pane-active-border-fg blue

set -g window-style fg=color240,bg=color235
set -g window-active-style fg=white,bg=black
set -g message-style fg=white,bg=color242,bold

# Status Line
set -g status-left-length 40
set -g status-left "#[fg=green]#S/#[fg=yellow]#I #[fg=cyan]P#P"
set -g status-right "#[fg=cyan]%Y-%m-%d %R"
set -g status-justify centre

set -w -g monitor-activity on
set -w -g visual-activity on

