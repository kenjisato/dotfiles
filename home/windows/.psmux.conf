# .psmux.conf — psmux (Windows-native tmux alternative)
#
# psmux はこの順で最初に見つかった設定ファイルを読む:
#   ~/.psmux.conf       ← これ
#   ~/.psmuxrc
#   ~/.tmux.conf
#   ~/.config/psmux/psmux.conf
#
# Deployed to ~/.psmux.conf by etc/deploy.ps1.
#
# Reload: 設定は psmux 起動時にしか読まれない。反映するには
#   psmux kill-server      # 全セッションを終了
# したあと、新しいセッションで起動する。`source-file` だと既存ペインに反映されない。

# --- IME (Japanese input) flicker mitigation -------------------------------
# escape-time 0      — IME の preedit がチラつく/消える主因を解消
# status-interval 10 — ステータスバー再描画頻度を下げ、入力中の文字消えを軽減
# focus-events on    — フォーカス変化通知をアプリ側へ渡す
set -g escape-time 0
set -g status-interval 10
set -g focus-events on

# --- Style -----------------------------------------------------------------
set -g status-position top
set -g status-left-length 90
set -g status-right-length 90

# 左: [ペイン番号]
#   ローカル運用ではホスト名は不要 (psmux サーバは起動時の env しか見ないので
#   `#(if defined SSH_CONNECTION ...)` 風の動的検出も信頼できない)。
#   SSH で入って常用するようになったら `psmux set -g status-left "#H:[#P] "` を手動で。
set -g status-left "[#P] "

# 右: (ペインタイトル) + CWD basename + 時刻
#   pane_title は PowerShell の `Set-PaneTitle <name>` で設定する。
#   複数の Claude Code を別ペインで動かすとき、ペイン切替時に status-right で
#   「いまどのプロジェクトのペインか」が分かるようにする用途。
#   未設定だと pane_title はホスト名 (status-left と重複) になるので、
#   #{==:...} で同値判定して、ユーザーが明示的に設定したときだけ表示する。
set -g status-right "#{?#{==:#{pane_title},#{host}},,[#{=21:pane_title}] }[#{b:pane_current_path}] [%Y-%m-%d(%a) %H:%M]"
