# Linked to ~/.config/starship.toml by etc/deploy and etc/deploy.ps1 — starship
# reads that path on every platform, Windows included.
#
# WHY THIS FILE EXISTS: starship's default module symbols are emoji (U+1F4E6 for
# package, U+1F40D for python, ...), and a Nerd-patched font is the only font
# this repo installs. Nerd patching adds glyphs in the private-use area and
# carries NO emoji, so on a box with no separate emoji font those defaults have
# zero coverage and render as tofu boxes. Measured on a Debian host with our font
# installed: U+1F4E6 and U+1F40D matched no font at all, while the prompt's
# U+1F310 and U+2A01 survived only because FreeFont and DejaVu happen to carry
# them — which is exactly the kind of partial luck this file removes. The fix
# pins every symbol to a glyph the font we install actually has, rather than
# adding a second font family to depend on.
#
# Generated, not hand-written:
#
#     starship preset nerd-font-symbols -o xdg-config/common/starship.toml
#
# then re-add this header. Only symbol keys are set, so every other starship
# default still applies. All 126 symbols below were verified against the
# Nerd-patched font this repo installs on the three platforms (HackGen NF via
# pkg/linux-fonts.txt and pkg/windows-fonts.txt, the equivalent casks in
# pkg/Brewfile); it ships the Nerd Fonts v3 code points these use.
#
# starship has no include directive, so there is no local-override slot to point
# at. A machine that wants different symbols replaces this file from a stacked
# tree, and etc/overlay-check reports that as the collision it is — accept it
# knowingly there rather than inventing an include mechanism here.

